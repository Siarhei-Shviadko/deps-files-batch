databaseChangeLog:
  - changeSet:
      id: 1
      author: Anton Navarka
      changes:
      - dropTable:
          tableName: user

      rollback:
        - createTable:
            tableName: user
            columns:
              - column:
                  constraints:
                    primaryKey: true
                    primaryKeyName: user_id
                  name: user_id
                  type: VARCHAR
              - column:
                  constraints:
                    nullable: false
                  name: first_name
                  type: VARCHAR
              - column:
                  constraints:
                    nullable: false
                  name: last_name
                  type: VARCHAR
