databaseChangeLog:
  - changeSet:
      id: create_batch_table
      author: Anton Navarka
      changes:
        - createTable:
            tableName: batch
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true
                    foreignKeyName: "fk_batch_group"
                    references: "group(group_id)"
                    onDelete: "SET NULL"
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                  defaultValue: "new"
              - column:
                  name: batch_metadata
                  type: json
                  defaultValueComputed: "'{}'::jsonb"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true
            indexes:
              - index:
                  name: idx_batch_group_id
                  columns:
                    - column:
                        name: group_id
              - index:
                  name: idx_batch_name
                  columns:
                    - column:
                        name: name
              - index:
                  name: idx_batch_id_tenant_id
                  columns:
                    - column:
                        name: id
                    - column:
                        name: tenant_id
      rollback:
        - dropTable:
            tableName: batch