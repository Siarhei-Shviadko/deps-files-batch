[tool.poetry]
name = "files_batch"
version = "0.1.0"
description = "Short description of project"
authors = []

[tool.poetry.dependencies]
python = "~3.11.9"
dependency-injector = "~4.44.0"
pydantic = "^1.8.1"
click = "^8.1.3"
psycopg2-binary = "^2.9.5"
uvicorn = "^0.18.3"
fastapi = "^0.120"
sqlalchemy = "^2.0.41"
more-itertools = "^10.6.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }
redis = "^5.2.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = ">=3.7,<5"
wemake-python-styleguide = "^0.17.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
types-requests = "^2.25.6"
requests-mock = "~1.9.3"
httpx = "^0.28.1"
httpcore = "^1.0.9"
ipdb = "^0.13.13"
pytest-lazy-fixture = "^0.6.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py311']
exclude = '''
(
    .venv
    | vendors
)
'''

[tool.pytest.ini_options]
markers = [
    "state_manager",
    "batch_query_repository",
    "batch_command_repository",
]
