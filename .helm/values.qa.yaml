files_batch:
  image:
    path: "/deps-platform/deps-files-batch"
  resources: {}

files_batch_settings:
  ENV: qa

  LOG_LEVEL: "INFO"

  DATABASE_REQUIRE_SECURE_TRANSPORT: false

migration_settings:
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

files_batch_consumer:
  image:
    path: "/deps-platform/deps-files-batch"

migrator:
  image:
    path: "/deps-platform/deps-files-batch-migrator"

helm:
  helm_logs_job_enabled: false

csi:
  vault_namespace: 'k8s-qa'
  roleName: 'k8s-qa'
  vaultKubernetesMountPath: 'kubernetes-qa'

service_account:
  serviceAccountName: 'deps-qa'
